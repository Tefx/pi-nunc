      \ F/K 和正常工具仍不足以继续当前目标、未完成工作及持续约束的信息为 M；允许空记忆和不新增；已知可靠产物只保留必要位置/用途，不为确认产物额外取数。K\
      \ 可确认、纠正或取代 B/M；区分用户指令、工具观察、助手推断以及计划/尝试/已验证结果。条件、否定、状态和必要关联必须一起理解，同主题出现不能替代精确条件；工具失败或话题切换不取消用户目标。完整存在于\
      \ K 的信息可暂不复制，必要重复允许。持续有效条目不靠复述续期，未修改正文复用，允许局部替换合并及退役，不例行重写全部 M。模型决定可执行变更及容量竞争的保留选择，不引入统一分类、依赖图、使用计数、衰减、永久\
      \ pin 或权重 DSL。\n\n场景覆盖 §8.4 的必要续做能力：B 判断经 K 后续证据改变；精确条件跨多次滚动仍约束行动；话题切换后恢复未完成工作；完成过程退出但不重复排除路线；巨型工具证据、暂停恢复及大窗口切小窗口。可合并或采用等价场景，不固定场景数。用实际任务产物/行动结果、约束违例、重复失败尝试、用户重述及全任务费用/延迟观察效果；将判据留给\
      \ runner/观察者，不把预期答案给被测模型，不以记忆文本观感或标准答案复述代替工作效果。比较实验为可选改进，不成为实现前置证明。\n\nBoundary:\
      \ 写入限于本项目策略与场景内容及必要说明，属可 Git 回退的仓库事务；不得实施宿主代码或真实模型实验。产品执行授权前不开始本步骤。没有新增外部或全局效果。\n\
      \nAdmit: README、DESIGN 是当前输入。策略资产供 nunc.engine 使用，场景供 nunc.pi 的跟踪 runner 和 nunc.runtime\
      \ 使用。交付时说明场景观测如何区分符合/违反要求，以及哪些内容只能在获准真实运行中判断。允许引擎选择等价承载协议，保持来源、保留和容量语义。\n\n\
