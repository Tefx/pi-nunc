  - id: nunc-v1.live-continuation
    name: 在授权模型服务上验证滚动续做、恢复与实际用量
    status: pending
    description: "```yaml\nstep_type: verification\nrepo_change_policy: no_repo_change\n\
      scope:\n  allowed_paths:\n    - src/**\n    - test/**\n    - scripts/**\n  \
      \  - package.json\n    - package-lock.json\n    - README.md\n    - docs/**\n\
      \  blocked_paths:\n    - plan.yaml\n    - .git/**\n    - .env\n    - .env.*\n\
      ```\n\nDeliver：依据 DESIGN 的真实运行要求，判断已集成候选能否在有限工作预算下完成一次持续任务，经历多次重叠滚动、带 K 续做与同\
      \ session 暂停恢复，并给出实际主请求和维护请求的用量、cache、费用/延迟及可观察任务结果。不能以编译、静态检查、fixture provider\
      \ 或模型复述记忆替代此结论。本验收直接消费前驱扩展与跟踪的运行入口，不另设重复的阶段或发布 gate，不要求优于所有现有 compaction。\n\n\
      Boundary：integration-verifier 的真实 seam/runtime 观察及 shell 能力符合本任务，保持仓库、产品配置和\
      \ managed state 只读。此步骤的目标是已集成不可变源码候选在隔离合成 persistent sessions 与模型服务上的执行；模型调用的费用、外部访问和取消后请求结算无法用\
      \ Git 回退，故与源码事务分开。只使用另行执行授权明确选定的服务及当前主模型、访问和支出上限；本次规划未授权这些调用。不得使用日常 Pi 会话、跨\
      \ session 自动记忆、全局资源或未批准的备用服务；不复制或记录凭据与其位置，已有访问通过宿主运行时交接。测试状态仅在执行时绑定的任务隔离区域，用户数据不可写。\n\
      \nAdmit：前驱的锁定依赖、真实 Pi 离线集成检查及已跟踪 verify:live 入口完成；执行时绑定 Git 候选、运行环境、当前模型、H/M/K\
      \ 设置、合成任务与授权界限。复用仍匹配的前驱机制证据，先无网络预检；只有目标、访问、费用/请求/时长上限及隔离状态均已获得执行授权并可观测才发模型请求。正常维护使用与该验证会话主\
      \ agent 相同的模型，观察普通工具工作和 Pi 自身触发、提交、重建，不能直接调用内部函数冒充端到端。\n\n场景将 B 中假设被 K 确认/推翻或改变用途、精确条件跨多次滚动、话题切换后恢复未完成工作、已完成过程退出而不再尝试已排除路线组合成有实物结果的合成任务；涵盖巨型工具结果、暂停恢复以及大窗口向小窗口切换时的重算/有界处理或显式容量拒绝。只为验证新模型容量所需的切换绑定额外模型，不默认扩展\
      \ provider 矩阵。保留 K 的原文及工具关联不被维护重写，连续提交后的上下文不重带旧 M，恢复不展开已退役历史。结构错误、取消和模型/path/session\
      \ 变化等可由前驱真实宿主 fixture 证据覆盖；对实际运行暴露的差异补测受影响范围。\n\n记录最终产物与行动、持续约束违例、重复失败尝试、需要用户重述的情况，以及全过程主请求/维护请求数量、输入/输出/cache\
      \ usage 和费用/延迟。cache 命中率不设保证，未返回的 usage 明确标为未知；不能将未知记零或推导虚假节省。固定任务 oracle 检查实际行为，不给模型标准答案，不把它的自报成功当验收。允许设计规定的有限遗忘；多模态/API\
      \ 限制按实现已声明范围解释，不声称未观察能力。若做普通 compaction 比较，则统一模型、工作预算和近期原文量并给双方合理配置机会；比较不是本步骤必需的额外交付。\n\
      \nRecovery：未获运行授权、缺少已批准访问或预算边界不明确时在请求前停止，报告未验证范围；这不影响已完成且仍有效的源码/离线证据。请求开始后取消或故障先核对进程、请求终态、usage\
      \ 和合成 session 已提交状态，不能盲目重放；费用上限或任务时限到达即停止并保留已有观测。不得修产品代码或改断言。若运行反例需要修改已完成前驱，由\
      \ Orchestrator 协调 writable repair，保留本步骤作为同一验收并仅复核受影响要求；缺乏证据须报告未证明，不能标记全部完成。"
    verification: "```yaml\nenvironment:\n  node: 26.7.0\n  npm: 11.19.0\n  pi_test_target:\
      \ 0.85.0\n  dependency_lock: package-lock.json\n  required_env:\n    - NUNC_VERIFY_MODEL\n\
      \    - NUNC_VERIFY_MAX_COST\n    - NUNC_VERIFY_MAX_REQUESTS\n    - NUNC_VERIFY_TIMEOUT_MS\n\
      checks:\n  - id: preflight\n    argv: [env, PI_OFFLINE=1, npm, run, verify:live,\
      \ --, --dry-run]\n    exit_code: 0\n  - id: live-continuation\n    argv: [env,\
      \ PI_SKIP_VERSION_CHECK=1, npm, run, verify:live]\n    exit_code: 0\n```\n\n\
      这些 argv 是前驱必须交付的未来入口，本次未运行。required_env 是非秘密执行选择：模型必须等于授权验证会话的当前主模型；金额、请求数和时长必须为执行授权内的正数，脚本不得自行选择首个可用\
      \ provider 或默认消费额度。已授权模型切换及隔离根由执行时任务绑定提供；秘密由宿主交接，不进入这些字段。前驱完成后在同一锁状态准备依赖，若已准备且未变化则复用，不重复安装或要求全局配置。\n\
      \n退出码零只证明 runner 无终止错误。验收还须直接观察真实服务响应、Pi 正常触发/快照/重建/续做/恢复及任务 oracle；真实模型与 fixture\
      \ 必须区分。输出反例、未证明范围和 usage 缺项，报告针对该候选与观测输入，不许伪造确定性、费用或 cache 成果。原文 K 与未修改 slots\
      \ 的内容相等检查服务于产品原文保留合同，无需额外 digest 或身份报告。"
