version: 1
project: pi-nunc
strategy_ref: docs/DESIGN.md
context: '目标是 README.md 与 docs/DESIGN.md 定义的 Pi 单 session 有界续做：重叠原文窗口、增量 slots、当前主模型的一轮维护、Pi
  单 snapshot 持久化和同 session 恢复。当前只批准规划、只读核对及原生 Git 保存；本计划保存不批准 claim 或执行任何步骤。后续代码实施、隔离运行与真实模型调用须取得相应执行授权；当前尤其没有模型实验的
  provider/endpoint、费用和运行额度授权。没有发布、push、日常 Pi 配置、用户 session、registry 或全局环境变更任务。

  现有仓库只有 README、DESIGN、Git 配置文件和空 Plan，没有实现、包清单、测试、benchmark 或项目验证入口。本次只运行了环境/Plan/Git
  只读检查。所有下述项目检查都是待交付入口，均未运行，不能作为现有 PASS。

  已检查现存 Node 26.7.0、npm 11.19.0、Pi package.json 0.85.0，以及安装目录下完整相关文档、公开 types、custom-compaction
  示例和 compaction/session/message 实现。安装文档 session-format.md 提到 retainedTail，但当前 dist
  的 CompactionResult、appendCompaction 与 buildSessionContext 仍使用 firstKeptEntryId；以当前公开类型及真实
  loader/SDK 运行结果确定支持范围，不能据文档承诺未存在的 API。默认 serializeConversation 会把 tool result 截至
  2000 字符；Nunc 完整来源不能沿用这一有损默认。ExtensionContext 无 reserve setter；ctx.compact 是先 abort
  的手动路径。宿主 preparation 在无可退出前段时不进入 hook；自动 threshold 在准备后才可被接管。反复滚动时宿主 kept-range
  可能跨旧 compaction entry，必须实测最终主请求只含最新 M。

  验证分界：确定性转换与真实本机 Pi loader/event/JSONL 可用受控 provider 隔离服务响应；这种证据不证明维护模型的取舍、真实 task
  continuation 或 provider cache usage。后者保留为独立模型运行效果边界。没有基准胜出要求，没有每阶段 Gate，也不创建 release/deployment
  决策。设计示例协议、比例与模块布局允许等价实现；首版一条完整 extraction 形态、一种有界容量恢复足够。'
phases:
- id: nunc-v1
  name: Nunc 首版：滚动续做与实测证据
  status: pending
  context: 交付顺序由消费关系决定：确定性候选合同供维护策略与 Pi 接入使用；策略及任务场景供接入实现和续做观察使用；可加载扩展与 tracked 观察入口供独立运行验证使用。各结果可独立修正，保留未受影响的证明。源码、必要测试、用户文档与其生产者一起交付。最终观察是当前模型与临时
    session 的独立效果边界；不构造覆盖相同判断的额外 Gate。
  steps:
  - id: nunc-v1.memory-transition
    name: 可独立验证的有界记忆与原文滚动决策
    status: pending
    description: "step_type: implementation\nrepo_change_policy: modifies_repo\nscope:\n\
      \  allowed_paths: [src/**, tests/**, scripts/check.mjs, package.json, docs/**,\
      \ .gitignore]\n  blocked_paths: [plan.yaml, .pi/**, .agents/**, .env, .env.*]\n\
      checks:\n  - id: memory-behavior\n    argv: [/opt/homebrew/bin/node, scripts/check.mjs,\
      \ --suite, memory]\n    env: {PI_OFFLINE: '1', PI_TELEMETRY: '0', PI_SKIP_VERSION_CHECK:\
      \ '1'}\n    expected_exit_code: 0\nDeliver: >-\n  交付给维护策略和 Pi adapter 的确定性候选合同：给定已冻结的活动消息投影、M、有效模型/输出预算和配置，可选择连续\
      \ B/合法原文后缀 K，或返回明确容量失败；给定模型变更和保留选择，可产生完整有界 M_next 与渲染结果。它是独立可验收的状态转换能力，尚不声称存在可运行\
      \ Pi 扩展。公开候选输入/输出和失败语义由代码及必要合同说明共同定义，内部文件划分自由。\n  空 M/无新增合法；未改正文直接复用；校验 ID、删除/替换/合并引用及候选覆盖，拒绝重复、未知、遗漏等歧义；容量淘汰只选择整条，错误旧结论不会因替代项放不下复活。保留顺序不重排存量，新增追加，包装和\
      \ ID 计入预算。\n  窗口合法性保持工具调用/结果关联与内容顺序，兼顾近期连续工作并允许长任务分批退出；不以任务完成或逐消息维护为前提。统一核算主请求\
      \ F、全部 M、K、新增尚未请求的消息/工具结果、输出/thinking/provider 限制及估计余量；extraction 输入输出另行核算，cached\
      \ tokens 占容量，未知 usage 不记零，前缀不重复计数。校验比例/绝对上限/A 正值；H 下降或模型变小时重算 M/K；取整后仍低于实际 H\
      \ 并有增长空间；不可分大消息明确失败。\nBoundary: >-\n  Node/TypeScript 产品代码的纯转换边界，无模型、网络、宿主持久化或真实\
      \ session 操作。只在后续获得实施授权的项目工作树修改源码、测试和合同，Git 可回退；不读取退役历史或外部产物，不安装软件。选定输入协议是实现决定，DESIGN\
      \ 的 add/remove/priority 只是可用示例。\nAdmit: >-\n  当前 README/DESIGN 是已见证的产品输入；当前没有项目测试。建立上列\
      \ native Node 检查入口和必要 package 元数据，从干净 checkout 可运行，使用 Node 标准库，不依赖全局 tsc、未声明\
      \ optional groups 或下载。跟踪所用 Node 支持范围及测试输入；本机已存在 Node 26.7.0，未发现可用全局或 Pi-local\
      \ tsc，不将 typecheck 冒充现有入口。行为用例实际执行变更/预算/边界：空集、重复/遗漏引用、局部替换与合并、整条跳过、不复活、稳定排序、split\
      \ tool turns、不可分大块、cached/unknown usage、输出预留与模型缩窗、H 降低后增长空间。测试失败应能区分真实回归，不能只检查文档或\
      \ prompt 的词句。\nRecovery: >-\n  无合法候选就返回可解释失败且不改变输入；测试/合同缺陷在本步骤修正。到当前授权或宿主能力边界停止，禁止通过\
      \ core patch、环境安装或缩小产品语义使检查变绿。"
    verification: 待本步骤建立 scripts/check.mjs --suite memory，执行 description.checks 的完整
      argv；本次规划未运行。证据说明候选/失败语义、实际行为测试及未覆盖的模型与宿主边界。
    evidence_template: 交付合同及改动；实际执行的检查 argv/exit/关键行为；尚未证明的 Pi 接入和模型内容判断。
    refs:
    - README.md
    - docs/DESIGN.md
    agent: node-typescript-engineer
  - id: nunc-v1.maintenance-policy
    name: 可执行维护策略与行动型续做场景
    status: pending
    description: "step_type: implementation\nrepo_change_policy: modifies_repo\nscope:\n\
      \  allowed_paths: [policies/**, eval/scenarios/**, docs/**]\n  blocked_paths:\
      \ [plan.yaml, .pi/**, .agents/**, .env, .env.*]\nDeliver: >-\n  为 Pi 接入交付一份内置通用维护策略及可被\
      \ task runner 消费的场景说明。策略以已交付候选协议为输出边界，围绕剩下 F/K/正常工具仍缺什么使用完整 M/B/K，提出局部新增、删除、替换/合并和容量保留选择；不添加\
      \ extractor agent、业务工具执行循环、分类 DSL 或策略路由。它是模型判断的独立产品资产，可调整内容取舍而不改宿主持久化和确定性预算。\n\
      \  明确 K 对 B/旧 M 的确认、纠正与失效，保留持续目标、未完成事项及仍有效的精确条件；短暂换题不取消原任务，工具失败不取消用户目标，助手复述不升级证据。完整重叠才可不复制，同主题关键词不够；已保存产物通常只保留必要位置/用途，不额外读取验证。先修正失效、再新增、最后容量比较；允许\
      \ M 空或不填满，完整未变 slot 复用，不例行重写全部记忆。不使用频率、存活年龄、使用计数、强制衰减或永久 pin。\n  交付有限的行动型场景：B\
      \ 判断被 K 确认/推翻；精确条件跨多次滚动；换题后返回未完成任务；完成过程退役且不重试已排除路线；巨大 tool result；暂停后同 session\
      \ 恢复；大窗口换小窗口。每场景定义起始任务/工具数据、后续扰动与可观察工作结果或约束违例，测试 oracle 与被测模型可见输入分离，禁止把标准答案喂给模型再计复述得分。可以合并共享一个任务的场景，不追求固定案例数。\n\
      Boundary: >-\n  LLM 行为策略与 eval 设计的仓库文本资产，由 llm-agent-expert 负责；不是 persona/skill/registry\
      \ 的部署，也不修改 runtime 实现。只读取已交付候选合同、产品输入及为本项目准备的合成数据。当前不发起真实模型、网络或付费实验。策略最终加载方式与场景执行代码属于下游\
      \ Node 接入。\nAdmit: >-\n  依赖 memory-transition 的实际候选协议和失败语义，避免用尚未支持的输出承诺指导模型。交付前做源合同推演，逐一解释正常增量、K\
      \ 纠错、条件差异、容量竞争和换题返回会如何影响候选与后续动作。无模型执行时，prompt 是否真正诱导这些行为仍未证明；不建词句存在、eval ID\
      \ 或 PASS 文本断言来充数。可检查机器可读场景结构，但仅声明结构合同覆盖。独立语义判断安排在 pi-extension 的完成程序及 task-observation\
      \ 的真实证据解释中，不为一次文案审查另建 Gate。\nRecovery: >-\n  若候选协议不能表达产品要求，报告具体反例，由有权控制方决定兼容修复边界；当前策略作者不回开已完成上游、不自行改\
      \ runtime/schema。调整策略或场景后保留有效底层机制测试；不能把未验证的策略质量作为步骤已有实测结果。"
    verification: 交付文本与场景的源合同推演及候选协议一致性检查；无有意义的离线模型行为自动化，不添加占位测试。真实策略效果由 task-observation
      验证。
    evidence_template: 实际策略/场景资产；与候选协议的消费关系；可观察动作和独立 oracle；静态推演结论与尚未运行的模型行为。
    refs:
    - README.md
    - docs/DESIGN.md
    depends_on:
    - nunc-v1.memory-transition
    agent: llm-agent-expert
  - id: nunc-v1.pi-extension
    name: 真实 Pi 滚动、单快照恢复与可复现观察入口
    status: pending
    description: "step_type: implementation\nrepo_change_policy: modifies_repo\nscope:\n\
      \  allowed_paths: [src/**, tests/**, scripts/**, eval/**, package.json, README.md,\
      \ docs/**, .gitignore]\n  blocked_paths: [plan.yaml, .pi/**, .agents/**, .env,\
      \ .env.*]\nchecks:\n  - id: pi-host-seam\n    argv: [/opt/homebrew/bin/node,\
      \ scripts/check.mjs, --suite, host, --pi-root, /opt/homebrew/lib/node_modules/@earendil-works/pi-coding-agent]\n\
      \    env: {PI_OFFLINE: '1', PI_TELEMETRY: '0', PI_SKIP_VERSION_CHECK: '1'}\n\
      \    expected_exit_code: 0\n  - id: observation-runner\n    argv: [/opt/homebrew/bin/node,\
      \ scripts/check.mjs, --suite, evaluation, --pi-root, /opt/homebrew/lib/node_modules/@earendil-works/pi-coding-agent]\n\
      \    env: {PI_OFFLINE: '1', PI_TELEMETRY: '0', PI_SKIP_VERSION_CHECK: '1'}\n\
      \    expected_exit_code: 0\nDeliver: >-\n  交付 Pi 可实际加载的 Nunc 扩展包：Pi 触发，冻结来源/策略/模型/session/path，使用候选引擎选\
      \ B/K，当前主模型维护，校验完整候选，一次返回 summary/details/firstKeptEntryId，由 Pi append/rebuild，带最新\
      \ M 和原文 K 继续并恢复。消费上游核心与策略；产品入口、必要 host tests、使用文档与为下游观察准备的 tracked runner 一起交付，不另做安装或发布。\n\
      \  采用 session_before_compact 统一 manual、threshold、overflow；工作 H/开关用生效 Pi compaction\
      \ 设置，检查 reserve 和 keepRecentTokens 能让 preparation 进入 hook；无可退出前段/不支持 ephemeral/多个\
      \ custom-compaction extension 的支持边界说清。不引入第二个调度器、不从每次 context 回调调用手动 compact、不自动改\
      \ Pi reserve 或日常设置。\n  正常普通请求完整保留活动原文和 tool bodies，全部 M 自动包含，不增加 memory tool/使用统计。维护从同一有效投影构建，包含新消息、尚未进入下一主请求的工具结果、名称/参数/关联/成功失败及可见\
      \ custom messages，尊重 Pi 已有可见性；不能回读退役 JSONL、工具附件或外部产物补全。选择一条公开 API 可支持的完整 extraction\
      \ 形态，允许显式 M/B/K transcript，不复制 Pi transport 或承诺缓存命中。不直接使用宿主 2000 字符 serializer\
      \ 作为完整来源。\n  使用当前 ctx.model 与公开 modelRegistry.complete/等价公开入口及宿主认证解析；正常一次模型请求，无业务工具执行循环。校验响应终态，length/pending/error/aborted\
      \ 即使有可解析 JSON 也不提交。结构错误最多一次带反馈修复，复用冻结来源/策略并重新检查容量。协议、认证、模型、取消和异常分支全部显式 cancel:true\
      \ 并说明原因，不能空返回落入默认 summary；完成前再次确认模型/session/path 未失效。维护 usage 包含修复实际开销，未知数据不编造。\n\
      \  完整主请求和 extraction 均预检，满输入是正常路径；实际放不下时首版只需一种有界容量缩减，例如明确标记 tool body head/tail，并提供禁止该缩减的\
      \ full 配置。不得暗裁用户指令、旧 M 或工具参数；记录省略范围，不声称已核对省略证据；参考 K 缩减不能改真正返回的 K。仍无法容纳就说明容量原因并取消，不顺序分块提取。多模态保留目标\
      \ API 支持的原生块；不可支持的类型明确限制，文字占位符不当视觉事实。\n  用 CompactionEntry.details 中一份版本化 Nunc\
      \ snapshot 保存 slots，summary 同候选渲染，Pi 是唯一持久化所有者。交付前不修改已存 M/边界；交付后 append/rebuild\
      \ 失败沿用 Pi，不另建数据库、双写、CAS/hash、重放或宿主回滚。恢复按当前选中路径最新 snapshot；外部/旧 summary 作为文本\
      \ slot 接入；new 空 M；tree/fork/clone 遵循活动路径，不自动跨 session 导入。连续滚动最终请求只含最新 M，旧 compaction\
      \ 不能混入 K；如需公开 context 投影，只剔除旧 summary，不过滤有效工具正文。\n  配置定义省略默认、memory 比例/可选绝对上限、保留比例、full/有界缩减及\
      \ policyFile 的相对路径基准（配置文件目录）；策略修改下次维护生效，同次修复仍用冻结版本。包入口和 README 定义支持的实际 Pi/API、启动方法、阈值选择、关闭自动后的手动行为、错误/容量/多模态边界及完整日志仍由\
      \ Pi 保留。原型实测之前不得把 DESIGN_ONLY 改成已验证有效或宣称优于 compaction。\nBoundary: >-\n  Node/TypeScript\
      \ host extension 的可逆仓库交付；内嵌策略内容消费上游文本，作者职责保持分离。后续本机验证只使用本项目隔离临时 session/config、内存\
      \ settings/credentials/model catalog 与受控 provider。不得读取日常 session、认证内容，修改全局配置、registry、Pi\
      \ 安装或 core，安装/下载依赖，调用真实模型或发布。文件读取/临时工具动作限定合成场景目录。\nAdmit: >-\n  已见证 Pi 0.85.0\
      \ 的公开 ExtensionContext、ModelRegistry.complete、CompactionResult、DefaultResourceLoader/SDK、SessionManager、SettingsManager.inMemory；版本及文档差异见\
      \ plan_context。建立上列 host/evaluation 检查，现有 scripts/check.mjs 在此扩展为真正集成测试。显式注入所选\
      \ Pi 安装 root，跟踪 package peer 依赖及测试宿主版本/解析方式，使用该安装已有 npm-shrinkwrap/dependency\
      \ graph 和 Node 26.7.0；从干净 checkout 直接运行，不靠 ambient virtualenv/PATH、npm 自动 peer\
      \ 安装、全局 tsc 或缓存补依赖。环境缺失应明报，不能调用安装器。\n  实际跨 loader、hook dispatch、主请求投影、Pi append/rebuild\
      \ 及 reopen JSONL；受控 provider 只替代服务输出，不 mock 这些待证明 seams。覆盖自动工具轮次阈值、新 user prompt、manual、overflow、无\
      \ hook preparation、连续多轮、same-session reopen、new/tree/fork/clone、已有 foreign summary、模型缩窗及\
      \ in-flight model/path/session 失效、取消、可解析截断、修复失败与不落默认摘要、宿主交付后失败归属、完整长工具正文和容量缩减/full\
      \ 拒绝。对消息来源和正文可做精确比较，因为原文保持是产品合同；不做无消费者 digest。\n  tracked scripts/evaluate.mjs\
      \ 消费上游场景、真实加载扩展并驱动普通 Pi 工作/工具动作及 rollover，输出任务结果、约束违例、重复失败尝试、用户重述、请求与维护 usage/cache/cost/latency、有效工作预算、保留原文量与容量限制。默认只能离线/预检；live\
      \ 必须显式模式和有效 run 配置，启动前拒绝缺失目标/额度/输入/停止条件，禁止隐式使用日常 session。测试真实执行 runner 的参数校验、错误退出、观测提取、预算停止和清理；受控数值不标成\
      \ provider 实测。普通 compaction 比较是可选改善工具；若执行，固定相同模型、工作预算/近期原文量并给 baseline 相当调参机会，无胜出门槛。\n\
      \  Orchestrator 完成程序需要 integration-verifier 独立观察上述真实本机 seams，并由全新上下文 llm-agent-expert\
      \ 只读审查实际接入的策略/场景是否表达原合同、是否把模型答案当测试；复用适用检查证据，不重复整套运行，不新增 review/Gate 节点。受控测试和这次审查仍不证明真实模型取舍或\
      \ cache 效果，保留给下游。\nRecovery: >-\n  测试/集成失败在当前步骤修复，保留未受影响的核心/策略证据。pre-handoff\
      \ 失败保持 saved state，post-handoff 只记录 Pi 的已观察结果，不自行重放。取消后停止临时 provider/session\
      \ 并清理本步骤创建的隔离资源，保留必要诊断；不触碰用户会话。若公开 API 无法满足材料要求，报告具体 seam 与限制，不通过私有 hook 或降低合同关闭任务。"
    verification: 待建立 host/evaluation suites 后执行 description.checks。完成程序包括 integration-verifier
      的真实本机 seam 证据与 llm-agent-expert 的有界策略审查；真实服务缓存及任务取舍明确未证。本次规划未运行任一项目 suite。
    evidence_template: 实际包入口/版本/解析状态；host 与 runner 命令及观察；独立 seam/策略审查；session 与失败恢复结果；明确区分受控
      provider 和待真实模型证据。
    refs:
    - README.md
    - docs/DESIGN.md
    depends_on:
    - nunc-v1.maintenance-policy
    agent: node-typescript-engineer
  - id: nunc-v1.task-observation
    name: 授权后观察真实模型的滚动续做与成本
    status: pending
    description: "step_type: verification\nrepo_change_policy: no_repo_change\nscope:\n\
      \  allowed_paths: [src/**, policies/**, eval/**, scripts/**, tests/**, README.md,\
      \ docs/**, package.json]\n  blocked_paths: [plan.yaml, .pi/**, .agents/**, .env,\
      \ .env.*]\nchecks:\n  - id: live-continuation\n    argv: [/opt/homebrew/bin/node,\
      \ scripts/evaluate.mjs, --mode, live, --pi-root, /opt/homebrew/lib/node_modules/@earendil-works/pi-coding-agent,\
      \ --config, .nunc-eval/run.json, --output, .nunc-eval/results]\n    env: {PI_OFFLINE:\
      \ '1', PI_TELEMETRY: '0', PI_SKIP_VERSION_CHECK: '1'}\n    expected_exit_code:\
      \ 0\nDeliver: >-\n  为首版续做判断提供真实当前模型、Pi 运行和完整任务过程的直接观察，填补离线受控 provider 无法证明的内容取舍/行为与真实\
      \ cache usage。至少证明一条真正完成工作的 Pi 触发→M/B/K 维护→持久化→带 K 继续→same-session 恢复路径，并对上游有限场景的材料要求给出\
      \ PROVEN/DISPROVEN/UNPROVEN，包含精确条件跨滚动、K 纠错、换题返回、避免已排除失败、巨大工具正文、暂停与模型缩窗。容量拒绝可符合明确失败合同，不能将真实成功路径全部替换为拒绝。\n\
      \  记录任务输出/工具动作、约束违例、重复失败、用户重述、整个任务输入/输出与 cache read/write、维护和修复开销、费用/延迟及所用模型/工作预算/实际\
      \ K。逐项区分实际 usage 和估计/缺失值；不能从缓存前缀或模拟值推定命中，零命中是合法观察。只观察冻结且已集成候选，不要求跨任意任务历史问答或所有\
      \ provider；比较如被选择遵循相同模型/预算/原文量，结果不必优于普通 compaction。\nBoundary: >-\n  只读产品与仓库状态的运行验证。这里有独立\
      \ provider 请求/费用及临时 session 效果边界，当前授权明确禁止执行它。必须先获得人对真实目标 provider/endpoint/model、有限费用/请求/时长上限、合成输入、隔离运行目录与停止条件的明确授权；配置只有非秘密运行绑定，认证沿用获准\
      \ host runtime handoff，禁止在 Plan/报告记录凭证或其位置。PI_OFFLINE 只禁止宿主启动联网，不是 provider\
      \ 调用授权。不能把本 Plan 或离线 PASS 当成付费许可。\n  使用上游 tracked runner 和冻结的产品 Git candidate，本项目专用临时状态，禁止修改日常\
      \ Pi/session/model 配置、registry、全局配置、安装下载、发布/push。只通过运行工具生成本次临时结果，不改源码、测试、阈值合同或\
      \ managed state，不实现修复。\nAdmit: >-\n  前置为已集成的 pi-extension、有效的 core/policy/真实本机\
      \ seam 证据和可运行的 tracked 观察入口。上列 argv 是未来入口，当前不存在脚本或 run 配置且未执行；后续获准运行时，在工作树外部管理的隔离临时状态中供给\
      \ .nunc-eval/run.json 所需非秘密配置，并保证输出忽略、不修改 tracked 产品。执行前绑定确切候选、实际目标、模型/预算/场景和额度，重用未变本机证据。缺少任何实测前提就保留\
      \ UNPROVEN，不让检查默认调用当前日常模型或自动创建凭证。\n  integration-verifier 执行并独立观察实际请求、任务动作与\
      \ JSONL 恢复；如模型输出含糊，Orchestrator 的本步骤完成程序可请全新上下文 llm-agent-expert 解释对应任务结果/证据，不能重写期望答案、扩大场景或新建相同接受决定。源代码检查、prompt\
      \ 复述或脚本 exit 0 单独不足以支持续做结论。没有固定 benchmark 分数、改善幅度或全局 release Gate。\nRecovery:\
      \ >-\n  未获真实调用授权时停止于 preflight，保留本步骤未执行。运行后达到额度/取消/服务失败即停止新请求，核对已发生请求费用与临时 session\
      \ 状态，清理仅本次资源；可能已发生效果但状态不明时先只读核对，不能盲目重放。发现产品缺陷返回完整兼容发现批次，由 Orchestrator 决定修复路径，验证角色不修改已完成生产者或源码；修复后本步骤做受影响范围再观察并复用其余证据。"
    verification: 必须有真实模型与临时 session 的直接证据，按 description.checks 的未来入口执行并检查任务动作/实际
      usage；当前未获模型实验许可、没有运行配置，禁止执行或宣称通过。缺口是执行授权与未来交付，规划本身无需现在选账号或产生费用。
    evidence_template: 授权目标/额度（无秘密）；冻结产品目标与完整命令；真实任务动作及恢复观察；实际 cache/费用/延迟与未知值；每项材料要求结论；停止及效果核对。
    refs:
    - README.md
    - docs/DESIGN.md
    depends_on:
    - nunc-v1.pi-extension
    agent: integration-verifier
