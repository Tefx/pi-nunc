      \ 2000 字符且中部含有效证据的结果；维护来源含最新已入上下文结果、错误状态、custom 消息和 K，不能仅拼 preparation.messagesToSummarize。\n\
      - 合法 B/K、长单轮、并行工具关联、无可退出前段；两类容量中的 F/output/thinking/多模态/缓存/未知 usage；L 增长空间、调低\
      \ H、大转小模型和不可分大消息。\n- auto 仅实际超容量时缩减并说明范围；full 不截正文；实际 K 不变；支持的多模态块保留，不支持时明确取消/限制，不虚构事实。\n\
      - malformed/length/error/aborted/pending 响应；一次修复成功/失败及修复容量不足；取消、session/path/model\
      \ 改变与策略冻结；断言实际候选是否交付和保存状态，不能只检查提示文本。\n\nPi 集成加载真实扩展并运行锁定版本的 AgentSession、SessionManager\
      \ 与扩展 runner。模型服务边界可用可控本地 provider 注入响应/故障/usage/取消，但不得替换被验证的 compaction、append\
      \ 或 rebuild。至少执行两次连续滚动并继续下一轮，通过实际请求投影与测试 JSONL 核对最新 M、K 原文/顺序、工具关联、完整日志保存及旧\
      \ summary 不复活。执行关闭/打开 same-session、reload、new、tree、fork、clone 和旧 summary 接入；session\
