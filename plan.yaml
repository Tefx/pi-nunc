      \ 'test/**/*.test.ts']\n    expected_exit_code: 0\n\n入口现状：当前没有 package/lock/test，以上是本步骤的交付检查合同，尚未执行或通过。规划核对了\
      \ node/npm/mise CLI 帮助及 Pi SDK 公开接口与示例，不能声称已见证本项目测试。干净 checkout 按锁文件包含 dev 依赖安装，不依赖缓存、ambient\
      \ virtualenv 或全局 TypeScript/Pi。第三项须实际发现并执行全部本地测试；空选择、跳过必验行为或仅输出 PASS 都不通过。若实际接口要求改最终\
      \ argv，由 Planner 在原步骤修正检查合同，不新增 setup/retry 节点。\n\n本地行为测试调用交付实现，至少覆盖：\n- 配置合法区间与无效配置；空\
