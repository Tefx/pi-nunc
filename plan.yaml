strategy_ref: docs/DESIGN.md
context: 依据 README.md 与 docs/DESIGN.md 从空计划创建 Nunc 首版实施计划。交付 Pi 单 session 的重叠原文窗口、有界增量记忆及宿主快照恢复；数值起点、字段示例、容量选择算法和内部模块划分保留实施选择。当前授权仅为规划，所有步骤均未执行，不授权
  claim、安装依赖、修改产品源码、使用日常 Pi session 或调用模型服务。未来仓库实施与真实模型验收须在对应执行授权内开展；模型实验的服务目标、访问及费用上限未由本计划授予。
phases:
- id: nunc-v1
  name: Nunc 首版：扩展交付与真实续做验收
  status: pending
  context: 仓库候选与模型服务上的运行证据具有不同的效果、费用和恢复边界，按依赖交付。窗口选择、slots、策略和 Pi 接管共同完成同一个扩展行为，文档没有要求单独发布内部库或策略框架，因此保留为一个源码事务。末端运行验收直接判断真实续做，不叠加重复
    gate；不要求证明优于所有普通 compaction。
  steps:
  - id: nunc-v1.package
    name: 交付有界滚动 Pi 扩展及可复现的离线宿主检查
    status: pending
    description: "```yaml\nstep_type: implementation\nrepo_change_policy: modifies_repo\n\
      scope:\n  allowed_paths:\n    - package.json\n    - package-lock.json\n    -\
      \ tsconfig.json\n    - src/**\n    - test/**\n    - scripts/**\n    - README.md\n\
      \    - docs/**\n    - .gitignore\n  blocked_paths:\n    - plan.yaml\n    - .git/**\n\
      \    - .env\n    - .env.*\n```\n\nDeliver：交付一个由 Pi 公共扩展加载器可加载的 TypeScript 扩展，连同必需配置、内置策略、用法说明、行为测试及后续真实验收入口。普通请求为\
      \ F + 全部 M + 活动原文 R；维护将连续 R 分为 B/K，返回同一候选渲染的 summary、slots 快照和合法 firstKeptEntryId。实现正常工作\
      \ → 宿主触发 → 当前模型维护 → 整条预算选择 → Pi 提交 → 原文 K 续做及同 session 恢复的完整源码路径；本步骤的离线证据只证明代码和宿主机制，实际模型判断与\
      \ cache usage 由后继运行验收证明。\n\n交付行为：slots 可为空；保留未变正文与存量相对位置，允许新增、删除、局部替换、合并，新增追加。验证变更和保留引用，容量竞争时按模型选择整条保留，包含\
      \ ID/包装预算，不截断正文；明确失效的旧结论不能因替代项放不下而复活。策略依据 F/K/正常工具之外的续做缺口处理 M/B，利用 K 的纠正和验证结果，区分要求、工具事实、推断和执行状态，保留条件、否定、未完成事项及已排除路线；不以提及频率、存活时间或话题切换自动淘汰，不添加强制类别、pin、衰减、计数器或权重语言。\n\
      \n预算与来源：依据有效模型、Pi compaction 设置和实际输出/thinking 选项核算主请求及独立 extraction 的完整输入、输出和余量；F\
      \ 含有效指令与工具定义，缓存 token 仍占容量，未知 usage 不当零。验证可用工作预算为正、memory fraction 范围、可选正数绝对上限和合法保留比例，边界取整后仍低于触发线并留增长空间。重算模型切换及降低工作阈值后的\
      \ M/K；不能只缩小最终 M 忽略 extraction 装不下。自动触发只复用 Pi reserveTokens/keepRecentTokens；处理\
      \ preparation 无可退出前段、不可分大消息、显式 compact、自动阈值及 overflow。不得增加独立调度器、私有 hook、core\
      \ patch，或承诺公开 API 不具备的自动改写 reserve 能力。\n\n维护采用主 agent 当时的模型及宿主模型注册/认证能力，正常路径一轮请求、不执行提取结果中的业务工具。先实现一条适合目标\
      \ Pi 的完整请求形态：可选显式 M/B/K transcript，无需复制 transport 或追求缓存前缀。来源以 Pi 当前有效主模型投影为界，包含尚未发送的新消息、完整工具正文、工具名/参数/关联/成功失败及所需自定义内容；不能直接沿用会默认截断工具结果的序列化捷径。普通轮次不隐藏工具正文，Nunc\
      \ 不自行读附件、外部来源或退役历史。只有实际容量不足才按文档选择一种有界输入缩减，记录省略；不暗截用户要求、M 或调用参数，不改变真正交回 Pi 的\
      \ K。支持的多模态使用原生内容；无法支持或仍装不下时明确说明限制并取消，不能以文字占位声称看过事实。无需同时实现多个 extraction 形态或分块多阶段恢复。\n\
      \n宿主与策略：冻结活动 session/path、M/B/K、模型和策略；完整响应终态、结构、引用、容量、边界与当前状态均通过才交付。可解析但 length/pending/error/aborted\
      \ 的结果不能提交；如支持有界修复，继续使用冻结来源且重新核算容量。失败、取消或 session/path/model 改变必须明确返回 cancel:true\
      \ 并说明原因，不能空返回而落入默认摘要。交付前保持已保存状态不变；交付后的 append/rebuild 与错误处理由 Pi 负责，不另加数据库、双写、hash/CAS\
      \ 或自动重放。连续滚动只呈现最新 M，K 不夹带旧 compaction。恢复选中活动路径最新快照，/new 空记忆，tree/fork/clone\
      \ 遵循宿主路径，外部/旧式 summary 可作为文本 slot 接入。支持 persistent session，说明多个自定义 compaction\
      \ 扩展同时接管不受支持。提供可选用户策略文件，明确相对路径基准和读取失败行为；下一次维护使用新策略，同一次维护及修复不换策略，策略不能越过容量/来源/session\
      \ 边界。\n\nBoundary：general 拥有此本地 Node/Pi 产品源码事务及其测试、文档。当前真实 roster 没有可覆盖 Node/Pi\
      \ 扩展产品实现的专门 owner；已核对 frontend-engineer 的完整合同限于 web outcome，forgemaster 排除产品功能，llm-agent-expert\
      \ 以提示/评估建议为职责，因此使用 general。此选择不依靠文件数或任务复杂度；内部窗口/记忆/提交接口没有独立发布消费者，拆开不能交付可用扩展。仅在另获实施授权后修改本仓库；本步骤检查使用隔离配置与合成\
      \ persistent sessions，无模型服务访问、全局安装、日常会话变更、发布或 push。仓库变更可 Git 回退，合成运行状态可丢弃；不触碰用户历史。\n\
      \nAdmit：README 与 DESIGN 全文是行为依据。已只读核对本机 Pi 0.85.0 的扩展/compaction/settings/SDK/session\
      \ 文档、示例及 dist 类型/实现；以该版本为首个验证目标，不宣称它是产品最低版本。当前 session-format 文档提及 retainedTail，但已安装\
      \ CompactionResult/CompactionEntry 类型及 append/rebuild 实现使用 firstKeptEntryId；按锁定版本实际公共合同接入并用真实宿主测试决定兼容性，不凭文档片段新增持久化协议。实现并锁定本地依赖/测试入口，让\
      \ clean checkout 可重现；运行入口的 Node/npm 版本与锁状态见 verification。将文档从纯设计状态更新为已交付候选的真实状态，说明配置、加载、限制、故障及验证方式，不提前声称模型验收通过。\n\
      \nRecovery：代码、依赖解析或离线宿主检查失败留在本步骤修复；禁止降低断言或以 mock 取代受测 Pi seam。捕获取消/失败后核对合成 JSONL\
      \ 与重建上下文，未交付时不出现新增 Nunc 快照或默认摘要，交付后宿主错误按宿主合同报告。若发现目标 Pi 无法通过公共接口交付产品约束，保留可复现反例并停止该不兼容路径，不改\
      \ Pi 或擅自更换授权目标。"
    verification: "```yaml\nenvironment:\n  node: 26.7.0\n  npm: 11.19.0\n  pi_test_target:\
      \ 0.85.0\n  dependency_lock: package-lock.json\n  setup_argv: [npm, ci, --include=dev,\
      \ --ignore-scripts, --no-audit, --no-fund]\nchecks:\n  - id: types\n    argv:\
      \ [node, node_modules/typescript/bin/tsc, --noEmit]\n    exit_code: 0\n  - id:\
      \ offline-behavior\n    argv: [env, PI_OFFLINE=1, npm, test]\n    exit_code:\
      \ 0\n  - id: live-runner-preflight\n    argv: [env, PI_OFFLINE=1, npm, run,\
      \ verify:live, --, --dry-run]\n    exit_code: 0\n```\n\n以上为本步骤必须新建的交付检查，不是当前仓库已存在或已运行的检查。当前只见文档仓库；已观察\
      \ Node 26.7.0/npm 11.19.0 和 node --test、npm ci 帮助。实施时把测试用 Pi 0.85.0、TypeScript\
      \ 与必要依赖固定进 package-lock；发布资源使用 Pi peer 约定，不打包另一份宿主。npm test 使用 Node 原生 test\
      \ runner 执行实际测试；类型检查使用本地锁定 TypeScript。检查自行验证执行版本；不依赖全局 Pi、ambient venv、未声明 dev\
      \ 依赖或自动工具链下载。\n\n离线测试执行 slots 变更/引用/整条预算/稳定正文与排列、空 M、替代放不下、F 与 cached/unknown\
      \ usage、多模态及大消息边界、修复与取消等行为。通过真正 Pi 扩展加载、事件派发、模型注册调用、SessionManager append 和重建测试手动/threshold/overflow、工具调用结果完整关联、当前新工具正文、连续滚动、resume/new/tree/fork/clone、外部\
      \ summary 和过期候选拒交。测试模型响应可由明确标识的本地 fixture provider 控制，便于触发 length、非法引用和状态变化；不能\
      \ mock 掉扩展加载或 append/rebuild seam，不能把 fixture 结果当模型策略效果或真实 cache 证据。确认普通轮次不维护\
      \ M、不额外查询来源。\n\nverify:live 由本步骤提供并做离线 dry-run，创建合成任务和隔离资源的计划、验证参数与授权输入，dry-run\
      \ 禁止网络请求或执行模型任务。真实入口依赖已授权当前模型与费用/请求/时长界限，缺少绑定时拒绝运行；评判最终产物、行动与约束违例，不向模型给预期答案或仅检查提示词\
      \ token。脚本负责创建并清理任务自己的配置与 persistent sessions，不发现或修改日常会话。无需实现通用 benchmark 平台。"
    evidence_template: 记录交付文件、锁定运行环境、实际检查 argv/退出码和所覆盖的行为；区分本地 fixture provider 与真实
      Pi seam。列出真实模型判断/cache/任务效果仍由后继验收承担的缺口，不把计划检查记为通过。
