  或报告。真实 TUI 队列/用户停止不得由 RPC 证据替代；固定 M/旧候选测试不证明新集成或模型效果。只读观察/验收 owner 不修仓库。普通诊断、失败修复和检查纠正不新增节点；若终端验收暴露已完成生产者缺陷，保持历史与同一
