      \ push。\n\nAdmit: 绑定最终已整合的不可变 Git candidate、stock Pi/Node 与匹配 lock、实际配置/策略/主模型、有效\
      \ H/reserve/keepRecent、M/K、完整输入、输出/thinking/defaults、媒体界限、所选 extraction 形态及缩减模式、受支持\
      \ Provider 组合。先消费最终候选完整 all 回归；缺匹配结果在获准 immutable checkout 补跑，缺检查/runner/TUI\
      \ 入口报告生产者缺口，不写临时替代逻辑或用真实模型额度探路。版本选择由 nunc.pi 统一，不能将 0.85.0 engine 组件证据或 0.85.1\
      \ 受控研究改标为本候选集成完成。\n\n必须观察所选组合的实际 stock TUI：活动工作中排入 steering、follow-up、扩展消息及冻结后新纠正；维护完整来源只到\
      \ R_t，未交付 D 不早入且交付后原样进入主请求。容量拒绝不发原 transport，经 Pi 有界 native overflow/compaction/retry\
      \ 后正常委托；观察队列/编辑器中没有自动恢复造成的撤回、丢失、重排或重复输入，真实用户停止及取消的维护不被重新启动。RPC 可补充自动化，但不能替代\
      \ TUI 的停止/编辑器/队列行为。维护身份分类避免递归；未知来源明确拒绝，用户取消及 provider 实际失败不被误归 Nunc 容量错误。核对\
      \ provider/model/config/reload/启停及声明支持的 stream/payload/defaults 组合，拒绝路径不能旁路预算。\n\
      \n观察真实 loader、threshold/manual/overflow 同一维护语义、主请求和完整 extraction 的实际预算/媒体与未知量、单\
      \ native CompactionEntry 的保存/上下文读回、连续多次跨 checkpoint 合法 K 重叠及仅最新 M、带 K 继续工作和同\
      \ session restart/resume。new/tree/fork/clone、旧式 summary、配置/模型变化、取消/非完整响应/非法引用/过期候选和不支持输入需有适用证据；交付前无效候选不改保存状态且不落默认摘要，交付后\
      \ append/rebuild 错误保留 Pi 的责任，不虚构 Nunc rollback。无需真实模型判断的生命周期行为可消费最终候选真实宿主+受控服务的匹配观察，不把服务\
      \ fixture 或 fixed-M 探针说成模型效果，也不重复仍有效的昂贵观察。\n\n使用已绑定的当前主模型运行 DESIGN §8.4 必要续做场景或等价组合，至少正常维护生成及其后续工作必须是真实模型。以实际工具行动/产物观察\
      \ K 纠正、精确条件跨滚动、恢复未完成工作、不重复已排除路线、巨型工具结果、暂停恢复、大窗口切小窗口，以及稍后 D 的纠正/指令在容量恢复后无重复无丢失地发挥作用。模型切换的每个目标与额度都必须处于既有授权的实际绑定中；字段或方法未就绪的必要观察保留\
      \ UNPROVEN，不能永久降为可选。判据只给观察者，禁止向被测模型提供预期答案；记忆文本或复述约束不代替续做行为，无需 benchmark 胜出。\n\
      \n每份观察说明候选/配置绑定、所执行真实 seam、服务受控或真实、覆盖要求、实际请求容量与省略、usage/cache usage、全任务 cost/latency、终态及限制。未知数明确\
      \ unknown，不按零或缓存收益解释；媒体运输 fixture 不证明视觉理解。证据只在私有运行输出供验收消费，不写仓库报告，不要求忽略的历史研究文件作为运行或安装依赖。\n\
      \nRecovery: 输入/绑定缺口先完成无效果准备，不再次索取已存在授权。任何可能开始的调用或状态操作先核对 usage、会话保存状态及 runner\
      \ 进程；额度到达、用户取消、失败或状态不明即停止后续效果，按已绑定边界清理并保留脱敏证据，不重放提交。缺新目标/凭据/费用权限或无法安全确定已发生效果时报告最小人工决定；技术缺陷报告给当前可写\
      \ producer，不修仓库、不改生命周期、不追加目标。"
