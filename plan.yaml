  - id: nunc.acceptance
    name: 最终整合 Nunc 完整项目验收
    status: pending
    description: "step_type: gate\nrepo_change_policy: no_repo_change\nscope:\n  allowed_paths:\
      \ [\"src/**\", \"policies/**\", \"tests/**\", \"scripts/**\", \"README.md\"\
      , \"docs/**\", \"package.json\", \"package-lock.json\", \".node-version\", \"\
      tsconfig.json\"]\n  blocked_paths: [\"plan.yaml\", \"plan-dashboard.html\",\
      \ \".git/**\", \".pi/**\", \".agents/**\", \".env\", \".env.*\", \"**/auth.json\"\
      ]\n\nDeliver: 对唯一 phase nunc-v1（Nunc 完整项目）全部交付作唯一终端项目接受决定：nunc.policy 的策略/场景、nunc.engine\
      \ 的增量滚动候选、nunc.pi 的 stock Pi 原生维护+队列安全准入与完整检查生产者、nunc.runtime 的实际 TUI/宿主和有界真实模型观察。本\
      \ gate 同时承担该阶段及完整项目的同一判断，不新增重复 phase/release gate。接受只说明修订 README/DESIGN 全部必要行为已交付且有效，不授权发布、部署、日常配置改变或新增调用。\n\
      \nAdmit: Orchestrator 绑定最终整合且不可变的 Git candidate、完整当前原生 all inventory、选定 stock\
      \ Pi/Node/依赖/配置/策略/provider/model、执行授权与全部有效观察。覆盖 DESIGN 各节所有必要要求，逐项关联实现及正向证据，给出满足/未满足/证据缺失；§8.2\
      \ 仅是索引。读取 ENGINE/DEVELOPMENT 的接口与实际检查约束，保留仍有效的已完成策略/引擎证据，不重写其历史。等价协议/参数/算法/容量缩减只验所选合法路径，不将未选可选项变成义务，也不以产品已贯通缩小完整交付。\n\
      \n完整判断涵盖：普通请求自动包含全部 M/已交付活动原文，维护冻结完整 R_t=B|K，未来/排队 D 不提前进入且交付后原样参与；无额外记忆工具或外部/退役历史取数。合法\
      \ B/K、工具关联、K 原文顺序和跨 checkpoint 重叠、增量复用/纠正/替换/合并/退役及完整 slot 预算均成立。\n\n容量及请求：实际主请求和完整\
      \ extraction 的 F/M/正文/工具/协议/媒体/包装、输出/thinking/defaults、provider 限制、cached/unknown、余量和增长空间；调低\
      \ H 或模型/配置变化重算两类预算；允许的 extraction 缩减有界显式且不改 K/D。新输入超限在真实 Provider 入口委托前拒绝，本地容量来源正向识别并走有界\
      \ native retry；用户取消、provider 真错误、维护失败区分。超大单条、无合法退出前段、关闭自动维护、未知来源或不支持配置有明确终态，不静默旁路、暗删输入或无限整理。维护调用分类阻止递归；声明支持的\
      \ provider/model/options/reload/legacy-stream/payload 组合有实际证据且不沿用失效包装。\n\n生命周期及持久化：stock\
      \ threshold/manual/overflow 维护同一语义和正常一轮当前模型请求；完整终态、signal、引用和 session/path/model/options\
      \ 绑定校验；失败/取消不交付无效候选、不落默认摘要。summary/details 与 K 边界来自一份权威 native CompactionEntry，交付前\
      \ saved state 与交付后 Pi append/rebuild/usage/错误责任明确，无 CustomEntry 自有 M/K、数据库/双写、重放或私有宿主事务。连续重建只使用最新\
      \ M 且保留合法跨旧 checkpoint 的 K；resume/restart/new/tree/fork/clone、旧 summary 和 persistent-session/通用扩展共存边界有证明。\n\
      \n实际 stock TUI 的容量恢复、steering/follow-up/扩展消息交付及编辑器/队列行为必须有正向观察：自动恢复不调用用户-stop\
      \ ctx.abort、不撤回/丢失/重排指令、不重复输入；真正用户停止和取消的维护不被重新启动。RPC 不能代替此 modality。选定队列安全 Provider+原生维护组合必须实际运行，受控研究中的自有\
      \ snapshot、fixed M、ASCII 估算、成功 RPC 或 setup-error 规范化不构成该组合完成。\n\n策略、配置及效果：内置/用户策略加载、路径基准、容量与\
      \ session 边界、下次生效和同次冻结；正常真实模型维护及实际续做场景覆盖纠正、跨滚动精确约束、未完成工作、排除路线、巨型工具、恢复/容量切换及后到\
      \ D 的有效交付。验 usage/cache/cost/latency 与 unknown/限制，不能用记忆文本/预期答案复述证明任务效果。Nunc\
      \ 保持独立，无 SDK host/替代启动器/双历史 mapper/core-private patch/其他项目依赖或配置修改。\n\n最终整合候选必须有全部适用原生离线回归，包括跨组件、正常、边界、失败、取消、恢复与支持组合；stock\
      \ Pi 0.85.1、peer/dev/lock 与测试版本统一，0.85.0 组件结果不能改标。可复用 demonstrably 适用的全量结果与未受影响底层\
      \ runtime 观察；过时候选报告或互不相关组件 PASS 不够。缺必要检查/runner 由可写生产者交付，Gate 不写测试/替代程序/仓库报告。固定\
      \ M、文档/prompt token、自报 PASS 或受控服务不能替代真实模型与实际 TUI 的必要证据。\n\nBoundary: 只读接受责任。可消费现有授权下绑定的隔离运行证据或在获准\
      \ immutable checkout 执行声明的离线检查，不改 source/config/docs/Plan/运行状态，不作付费/真实模型调用、安装、发布或\
      \ cleanup。已有全部预授权继续有效，具体运行绑定与证据缺失应准确分类，不能宣称全部执行未授权或重复索取同目标许可。排除 DESIGN 明确非目标、未选可选路径、benchmark\
      \ 胜出和新想象需求。\n\nRecovery: 分类全部必要要求并返回一个兼容问题批次。阻断缺陷、必要检查失败或必要行为/证据 UNPROVEN 阻止\
      \ PASS；生产者 done 或观察报告结束不代表项目完成。只读 gate 暴露已完成生产者缺陷时保留本 gate 与完成历史，由 Orchestrator/Planner\
      \ 接入可写修复；整合后同一 gate Delta 覆盖受影响要求、直接依赖、未解决问题及触及不变量，复用无关有效证据。无新 retry gate 或重复昂贵实验。"
    verification: "```yaml\nchecks:\n  - id: integrated-project-offline-regression\n\
      \    argv: [/usr/bin/env, -u, NODE_OPTIONS, PI_OFFLINE=1, PI_SKIP_VERSION_CHECK=1,\
      \ PI_TELEMETRY=0, /opt/homebrew/bin/node, scripts/check.mjs, all]\n    exit_code:\
      \ 0\n```\nengine 入口已由已完成生产者交付，nunc.pi 将 all 扩展成完整项目 inventory。Gate 消费最终整合候选的匹配全量结果或在获准\
      \ immutable checkout 运行，不以旧版本/旧候选组件检查或空选择代替。消费 nunc.runtime 的 stock TUI/RPC、单快照/合法重复重叠及真实当前模型维护续做证据；Gate\
      \ 不重复有状态/付费操作。FULL 覆盖全部必要要求，适用 Delta 保留未变有效证据；所有必要要求都有正向匹配证明且无阻断缺陷才可 PASS/声明完整项目完成。实际\
      \ TUI 缺失、未知必要行为、失败检查、未统一 runtime/lock 或未执行必要模型观察均保持验收未完成，并给出可验证关闭条件。预授权本身不证明任何观察已发生。报告由\
      \ Orchestrator 消费，Gate 不改生命周期。"
