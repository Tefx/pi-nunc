context: "交付 README/DESIGN 定义的完整 Nunc 项目，唯一 phase 为 nunc-v1，ENGINE、PI、POLICY、DEVELOPMENT、LIVE\
  \ 与跟踪场景承载接口、检查与观察。最新用户要求在原运行自然结束后修正有据过度防御并检查同类问题，再继续剩余运行及完整接受。已完成 policy、engine、pi、observation-support、discovery、simplification\
  \ 的定义/状态/证据/历史不变。nunc.defensive-controls 交付一个有用安全诊断与有据限制修正的仓库能力，供原 nunc.runtime\
  \ 消费，再由原 nunc.acceptance 作唯一完整项目决定。独立定向 intake 属新增实现步骤内的准备/完成程序，复用旧完整全仓覆盖和已处置根因，不新增\
  \ read-only 阶段、逐发现节点、修后全仓 reviewer 或重复接受。\n\n保留公共产品边界：维护冻结有效 F、全部 M、活动路径已经交付的完整\
  \ R_t=B|K、模型/选项/策略；未来 D 不预测/提前消费，交付后原样进入主请求及后续维护。普通请求自动包含全部 M 和已交付原文。K 原文/顺序/合法跨旧\
  \ checkpoint 重叠保留，仅最新 M；M 有界、增量、整条预算、未改正文复用、纠正/替换/合并/退役且失效旧项不复活。Pi 独占 native 模型目录/选择、配置、认证、transport、compaction\
  \ 调度、队列、单 CompactionEntry 发布、append/rebuild、usage 和活动路径恢复。Nunc 独立容量准入按真实输入/输出/thinking/defaults/媒体/unknown-cache\
  \ 语义核算，正向识别本地容量失败进入原生有界恢复。无递归维护、输入重放、队列撤回/丢失/重排、未知来源旁路、失效 wrapper；取消优先，自动恢复不调用 TUI\
  \ 用户停止；失败/取消不交付、不落默认摘要。完整来源、normal full extraction、可选有界显式缩减且不改 K/D 的 DESIGN 边界不变。\n\
  \n默认与认证：产品用活动测试 session 的有效 model/provider/options/config，含启动选择和 runtime switch；新\
  \ standalone 场景继承效果前最新普通保存 Pi defaults。只转发当前被测调用必要的非秘密未保存有效选择，旧父 capsule/Astra 不进新批次，不反向固定\
  \ Gemini。必要 named override 只影响新任务并记录理由/差异，不重建 catalog、不重复填写 defaults/approval。隔离新\
  \ session/cwd/文件/输出，保护既有 sessions/settings/defaults、dotfiles/控制面、宿主、其他项目和秘密。Pi 正常认证解析/刷新/保存保持既有\
  \ owner；Nunc/runner 不复制 profile/凭据、不实现 auth-handoff/OAuth store/refresh/login、不改账户绕过\
  \ native OAuth、不要求 auth bytes 冻结。凭据值及来源位置不进提示、Plan、stdin/argv 或报告。诊断只保留安全且有用的 native\
  \ status/code/原因，禁止 raw auth/provider 日志或未筛选私密正文。不能从已抹除的错误推断 HTTP 原因、认证或可用性。\n\n\
  无可执行输出 cap 时保留完整原生能力，不放宽估计、虚构小 output/window 或 provider framing 换取绿色。unknown usage/billing\
  \ 保持未知，catalog/native 估算或零占位不证明账单、实付零或绝对 USD 保证。仅独立 persistent-session Pi 扩展；无 SDK\
  \ host/替代启动器/CustomEntry 自有 M-K/双历史 mapper/core-private patch/自动跨 session/主动检索/记忆库/文档写入服务/额外维护调度或多\
  \ provider 缓存框架。按合作型 actors/local processes 处理错误、无效输入、失败/竞态/泄漏/遗漏，不加入 hostile-local-agent\
  \ 威胁或风格 blocker。推荐协议/算法/参数及可选路径允许等价方案，不要求 benchmark 胜出。\n\n完整实施、同目标可逆准备/锁定依赖安装、离线检查及有界真实验证已有预授权。仓库\
  \ producer 只做新建受控 host/service 检查，真实模型效果留在 runtime。Orchestrator 在每个新效果批次绑定实际新任务\
  \ target、native 非秘密 metadata、必要 named override、有限总 call/token/time/known-cost 和清理，不隐式沿用已结束配额/旧模型，不作付费\
  \ quota probes。caller 的 per-case 过小分配在既有总授权内修正，按场景步骤和实际变动留余量，不把历史 call 数变成产品上限、保证或固定最小值。主请求/维护共用额度，全部成功/失败/unknown\
  \ reservations 保留、不退款。失败停止受影响场景并核对；一个已终结且本地效果已核对的独立失败，不自动禁止其余隔离、无依赖且总预算成立的场景。缺终态、活动进程、损坏账本、可能越界或无法核对的关联效果仍停止相关执行；全局取消/总限额停止全部。unknown\
  \ billing 与未知本地执行分开，local terminal/abort 不证明远端取消/账单。旧 single-use targets 不重放，新增诊断不授权盲目\
  \ paid retry。缺现有绑定先做同权限准备；仅实际新目标、不可恢复损失、新费用/凭据/账户、产品含义矛盾、明确禁止或安全核对仍无法确定既有效果等人工边界才询问。禁止发布、全局安装扩展和\
  \ push。\n\n证明：旧完整 discovery 的静态覆盖与根因处置留在适用原报告，新线索沿实际消费者作定向检查；报告/建议不创设额外义务。新增 producer\
  \ 在同一事务交付有据完整相关批次、有效诊断/控制能力和必要行为检查，runtime 提供真实事实与有界要求判断，唯一 gate 判断完整覆盖/适用性/矛盾与质量。c4/full\
  \ 必须有巨型完整工具暴露、中部例外、无省略 extraction、退役和产物；late-D 必须冻结排除、维护中接收、原样一次交付、真实约束行动，错误 exact\
  \ oracle 与正向事实分开，改断言不等同语义 PASS。两者已成立观察按适用性保留，不为信心重跑。c4/capacity 须实际可达 CAPACITY、零\
  \ extraction、saved M-K 不变/无默认摘要，CONFIG 不等同。c5 须真正严格更小 native 模型、两类预算/M-K 重算、维护和续做；已成立\
  \ switch/thinking/主预算事实不替代剩余模型维护/产物。旧窗口/失败假设不能固定或豁免新场景，降低 H 不缩 frozen full source。\n\
  \n报告绑定最终整合不可变候选；底层观察按 source/lock/config/命令/modality/authority/要求因果适用性独立判断。复用有效\
  \ c1–c3、stock TUI/native、c4/full、late-D 和 c5 已观察事实；Plan-only/格式/报告绑定变化不重放。源码/依赖/整合变化補受影响证明及最终整合完整\
  \ offline inventory。受控服务/固定 M 只证明机械行为，docs/prompt token、预期答案、自报 PASS 不证明真实续做。全部必要要求有当前正向证明、全部有据发现处置闭合、最终完整回归有效且无阻断缺陷才接受；只读消费者缺\
  \ tracked runner/check 需兼容 writable producer，不重开 DONE。\n\n```yaml\ncheck_environment:\n\
  \  node_version: 26.7.0\n  npm_version: 11.19.0\n  stock_pi_version: 0.85.1\n  development_dependencies:\n\
  \    \"@earendil-works/pi-coding-agent\": 0.85.1\n    \"@earendil-works/pi-ai\"\
  : 0.85.1\n    \"@types/node\": 26.4.1\n    typebox: 1.3.7\n    typescript: 5.9.3\n\
  \  dependency_manifest: package.json\n  dependency_lock: package-lock.json\n  runtime_declaration:\
  \ .node-version\n  dependency_setup_argv: [/usr/bin/env, -u, NODE_OPTIONS, npm_config_cache=.npm-cache,\
  \ npm_config_ignore_scripts=true, npm_config_update_notifier=false, /opt/homebrew/bin/node,\
  \ /opt/homebrew/lib/node_modules/npm/bin/npm-cli.js, ci, --include=dev, --no-audit,\
  \ --no-fund]\n  tui_python_argv: [/usr/bin/python3]\n  tui_prerequisites: [POSIX\
  \ PTY, Python 3 standard library]\n```\n检查从获准干净 checkout/跟踪 lock 重现；准备与检查分开，无隐式安装/更新/全局\
  \ Pi 导入或 native profile 复制。错误版本、缺依赖/入口/必要子集或空 inventory 明确失败；all 覆盖全部 engine/Pi/live\
  \ 和跨组件行为，不固定历史测试数，不重标旧候选组件 PASS。"
