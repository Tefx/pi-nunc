      \ [mise, exec, node@26.7.0, --, node, test/live/continuation.ts]，不把固定 provider\
      \ 升为产品要求。合成持续工作场景覆盖 B 判断被 K 纠正、精确条件跨多次滚动、换题回到未完成目标、已完成过程退出且不重复已排除尝试，以及巨型工具结果、暂停恢复和小窗口容量限制。通过实际产物、工具行动及独立于维护提示的任务断言判断结果，不给模型验收答案，不用记忆复述或\
      \ prompt 词语命中冒充行为。记录整个任务的结果、约束违例、重复失败尝试、用户重述次数，以及含维护/修复的 token、cache read/write、费用与延迟；未报告的指标标不可用，真实\
      \ cache 为零也照实记录，不设缓存命中率或胜过普通 compaction 的门槛。观察供当前步骤完成使用，无独立后续证据消费者，不新增验收节点。未获授权、未运行或结果不满足时明确保留证据缺口。"
