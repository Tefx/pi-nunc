  取消不替代 full 续做成功，真实更小模型要求未满足不得静默豁免。全部交付已有预授权；native Pi 有效默认/认证继承、未封顶输出、unknown billing、单次效果/额度/核对及既有
  sessions/settings/秘密保护保持。无凭据复制、auth 子系统、新批准仪式、发布/全局安装/push。只读 owner 不修仓库；报告缺失先修报告，必要观察在原
