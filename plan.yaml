context: "交付 README/DESIGN 定义的完整 Nunc 项目，唯一 phase 为 nunc-v1，ENGINE、PI、POLICY、DEVELOPMENT、LIVE\
  \ 与跟踪场景承载接口、检查与观察。最新用户明确要求修正不必要 API 限制，彻底检查全仓同类过度设计并修正，然后继续完整交付；实现说明和既有支持名单不能自行授权重复\
  \ native 职责。nunc.policy、nunc.engine、nunc.pi、nunc.observation-support 四个 DONE 的定义/状态/证据/历史不变。nunc.discovery\
  \ 交付完整只读根因批次给 nunc.simplification 的可写 owner；原 nunc.runtime 消费修正并补/复用真实事实；原 nunc.acceptance\
  \ 作包含全部结果的唯一最终项目接受，不增加逐发现节点或修后重复全仓 reviewer。\n\n保留已接受公共边界：维护冻结有效 F、全部 M、当前活动路径已交付的完整\
  \ R_t=B|K、模型/选项/策略；未来 D 不预测或提前消费，交付后原样进入主请求及后续维护来源。普通请求自动包含全部 M 和已交付原文。合法 K 保持原文、顺序及跨旧\
  \ checkpoint 重叠，仅最新 M。M 有界、增量、整条预算、未改正文复用、纠正/替换/合并/退役且失效旧项不复活。Pi 独占 native 模型目录/选择、配置、认证、transport、compaction\
  \ 调度、队列、单 CompactionEntry 发布、append/rebuild、usage 和活动路径恢复。Nunc 保留独立请求容量准入，按真实输入/输出/thinking/defaults/媒体/unknown-cache\
  \ 语义核算，正向识别本地容量失败并进入原生有界恢复。无递归维护、输入重放、队列撤回/丢失/重排、未知来源旁路或失效 wrapper；取消优先，自动恢复不调用\
  \ TUI 用户停止；失败/取消不交付、不落默认摘要。完整来源、normal full extraction、可选有界显式缩减及不改变 K/D 的边界按 DESIGN\
  \ 保持。\n\n当前默认/认证约定：产品使用活动测试 session 的有效 model/provider/options/config，包含启动选择和 runtime\
  \ switch；新 standalone 场景继承效果前最新普通保存 Pi defaults。只转发当前被测调用确实需要的非秘密未保存有效选择；旧父 capsule/Astra\
  \ 不进入后续新批次，不反向固定 Gemini。必要命名 override 只影响当前新任务并记录理由/差异，不重建 catalog、不重复填写 defaults/approval。隔离新任务\
  \ session/cwd/文件/输出，保护既有 sessions、settings/defaults、dotfiles/控制面、其他项目与秘密。Pi 正常认证解析/刷新/保存保持原有\
  \ owner；Nunc/runner 不复制 profile/凭据、不实现 auth-handoff/OAuth storage/refresh/login，不改账户绕过\
  \ native OAuth，不要求 auth bytes 冻结。凭据值及来源位置不进提示、Plan、stdin/argv 或报告。无可执行输出 cap 时保留完整原生能力，不放宽估计、虚构小\
  \ output 或小 window 换取通过；unknown usage/billing 不是零，catalog 估算/原生零占位不能证明实付零或绝对 USD\
  \ 保证。\n\n仅独立 persistent-session Pi 扩展；无 SDK host、替代启动器、CustomEntry 自有 M/K、双历史 mapper、core/private\
  \ patch、其他项目依赖/配置修改、自动跨 session、主动检索、记忆库、文档写入服务、额外维护调度或多 provider 缓存框架。按合作型产品 actors/local\
  \ processes 处理缺陷、错误输入、失败/竞态/泄漏/遗漏；不加入 hostile-local-agent 威胁或风格偏好 blocker。推荐协议、参数、算法、可选路径保留等价实现空间，不要求\
  \ benchmark 胜出。\n\n完整实施、同目标可逆准备/锁定依赖安装、离线检查及有界真实验证已有预授权。真实效果前 Orchestrator 重新绑定实际新任务\
  \ target、native 非秘密 metadata、必要 named override、call/token/time/known-cost 限额与清理；不沿用已完成批次剩余额度或旧模型配置，metadata\
  \ 可行性不构成调用/可用性证明，不以付费 quota probes 搜索目标。主请求/维护共同受效果限额控制。可能开始的效果先核对再继续，不重放旧 targets，失败/取消/不明状态停止后续效果。缺现有绑定同权限准备；只有新目标、不可恢复损失、新费用/凭据/账户、未定义产品含义、明确禁止或无法安全确定既有效果等真实人工边界才询问。禁止发布、全局安装扩展和\
  \ push。\n\n证明消费者明确：完整 discovery 的静态 findings/coverage ledger 留在该报告供修正消费，不成为新 registry/authority。生产者交付候选、全部有依据发现处置及必要行为检查，不默认另加\
  \ verifier。运行 owner 提供真实事实/有界要求判断，最终 gate 判全部必要要求覆盖、证据适用性、跨结果矛盾和质量。c4/full 仍须真正巨型完整暴露/无省略\
  \ extraction/退役/实际产物；late-D 输入/oracle 要有产品依据，保留冻结排除/时序/一次交付/真实约束行动，错误 exact oracle\
  \ 与正向事实分开，修改断言不构成行为 PASS；c4/capacity 要实际可达取消/零 extraction/saved M-K 不变/无默认摘要，CONFIG\
  \ 不等同；c5 要实际大到严格更小 native 模型与重算/维护/续做。旧模型窗口和失败假设不能豁免或固定新场景，降低 H 不缩已冻结 full source。\n\
  \n报告绑定最终整合不可变候选，底层观察按 source/lock/config/命令/modality/authority/要求是否仍适用独立判断。保留有效\
  \ c1–c3、stock TUI/native 生命周期及 late-D 正向事实；Plan-only/格式/绑定变化不自动重放。源码/依赖/整合变化补受影响证明及最终整合完整离线\
  \ inventory。受控服务/固定 M 只证明机械行为，docs/prompt token、预期答案或自报 PASS 不证明真实续做。所有必要要求有当前正向证据、完整发现处置有据、最终回归有效且无阻断缺陷才接受项目；只读消费者缺\
  \ tracked runner 时需要兼容 writable producer，不重开 DONE。\n\n```yaml\ncheck_environment:\n\
  \  node_version: 26.7.0\n  npm_version: 11.19.0\n  stock_pi_version: 0.85.1\n  development_dependencies:\n\
  \    \"@earendil-works/pi-coding-agent\": 0.85.1\n    \"@earendil-works/pi-ai\"\
  : 0.85.1\n    \"@types/node\": 26.4.1\n    typebox: 1.3.7\n    typescript: 5.9.3\n\
  \  dependency_manifest: package.json\n  dependency_lock: package-lock.json\n  runtime_declaration:\
  \ .node-version\n  dependency_setup_argv: [/usr/bin/env, -u, NODE_OPTIONS, npm_config_cache=.npm-cache,\
  \ npm_config_ignore_scripts=true, npm_config_update_notifier=false, /opt/homebrew/bin/node,\
  \ /opt/homebrew/lib/node_modules/npm/bin/npm-cli.js, ci, --include=dev, --no-audit,\
  \ --no-fund]\n  tui_python_argv: [/usr/bin/python3]\n  tui_prerequisites: [POSIX\
  \ PTY, Python 3 standard library]\n```\n检查从获准干净 checkout 与跟踪 lock 重现；准备/检查分开，检查不隐式安装/更新、导入全局\
  \ Pi 或复制 native profile。版本错误、缺依赖/入口/必要子集、空 inventory 明确失败；all 覆盖全部 engine/Pi/live\
  \ 及跨组件行为，不固定历史测试数量或把旧候选组件结果重标为最终 proof。"
project_guidance: 先执行 nunc.discovery 的完整只读发现，再由 nunc.simplification 的 node-typescript-engineer
  消费全根因批次修正 source/tests/docs；不只补新 API 名称、不制造重设计义务、不启动 manual loop。四个 DONE 定义/证据/历史不可变。原
  nunc.runtime 保持真实新任务/模型效果边界；原 nunc.acceptance 是唯一项目接受，消费完整发现处置、最终整合 all 与必要运行事实，无额外修后全仓
  reviewer。产品跟随当前测试 session 的有效模型/切换，新 standalone 批次读取最新正常保存 Pi defaults；不转发旧父 capsule/Astra、不固定
  Gemini、不继承旧剩余额度。新效果先绑定真实 target/metadata/必要命名 overrides/call-token-time-known-cost。保留
  native auth/transport/目录/compaction/队列/persistence、实际输出、unknown billing、bounded
  M/verbatim K/frozen R/future D 及单次效果/核对/保护。c4/full、late-D 真实约束行动、可达 capacity 取消及
  c5 真正严格更小模型续做仍必需；错误 exact oracle 与正向时序/交付证据分开，旧模型余量不限制当前默认。复用适用 c1–c3/stock TUI/native/late-D
  正向事实；source/lock/config/integration 变化补受影响证明及最终完整离线回归，报告重绑定不重放有效观察。缺报告先修报告、缺观察在原
  owner 补齐、DONE 后可写缺口经 Planner 接入兼容交付，不 reject/reclaim DONE、不逐问题建节点。除 Vectl 管理 Plan
  外不改 dotfiles/控制面、既有 sessions/settings/其他项目/秘密；无 host patch、复制凭据/auth 子系统、发布/全局安装/push。
